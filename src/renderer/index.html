<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="color-scheme" content="dark light">
  <title>Clipper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="head">
      <h1>Clipper</h1>
      <p>Нарезка стримов на клипы</p>
    </header>

    <section class="block" aria-label="Видео">
      <div id="drop" class="drop" role="button" tabindex="0" aria-describedby="drop-hint">
        <svg class="drop-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
        </svg>
        <span class="drop-title">Перетащи видео сюда</span>
        <span id="drop-hint" class="hint">или нажми, чтобы выбрать файл</span>
      </div>

      <div id="file" class="file" hidden>
        <div class="file-info">
          <span id="file-name" class="file-name"></span>
          <span id="file-meta" class="hint"></span>
        </div>
        <div class="file-actions">
          <button id="file-change" class="btn ghost" type="button">Сменить</button>
          <button id="file-remove" class="btn ghost" type="button">Убрать</button>
        </div>
      </div>

      <div id="remove-confirm" class="confirm" hidden role="group" aria-labelledby="remove-title">
        <span id="remove-title">Это видео скачало приложение. Что сделать с файлом?</span>
        <div class="confirm-actions">
          <button id="remove-keep" class="btn ghost" type="button">Оставить на диске</button>
          <button id="remove-trash" class="btn ghost danger" type="button">В корзину</button>
          <button id="remove-cancel" class="btn ghost" type="button">Отмена</button>
        </div>
      </div>

      <form id="url-form" class="url-row" autocomplete="off" novalidate>
        <label class="sr-only" for="url">Ссылка на видео</label>
        <input id="url" type="text" inputmode="url" placeholder="Или вставь ссылку на видео" spellcheck="false">
        <button id="url-go" class="btn secondary" type="submit">Скачать</button>
      </form>
    </section>

    <section class="block settings" aria-label="Настройки">
      <fieldset class="field">
        <legend>Режим</legend>
        <div class="seg n2">
          <span class="thumb" aria-hidden="true"></span>
          <label><input type="radio" name="mode" value="smart" checked><span>По звуку</span></label>
          <label><input type="radio" name="mode" value="fixed"><span>Подряд</span></label>
        </div>
        <p id="mode-hint" class="hint"></p>
      </fieldset>

      <fieldset class="field">
        <legend>Длина клипа</legend>
        <div class="seg n3">
          <span class="thumb" aria-hidden="true"></span>
          <label><input type="radio" name="len" value="20" checked><span>20 с</span></label>
          <label><input type="radio" name="len" value="30"><span>30 с</span></label>
          <label><input type="radio" name="len" value="60"><span>60 с</span></label>
        </div>
      </fieldset>

      <div id="count-field" class="field">
        <div class="field-row">
          <label for="count">Сколько клипов</label>
          <output id="count-out" for="count">15</output>
        </div>
        <input id="count" type="range" min="3" max="100" step="1" value="15">
      </div>

      <label class="check">
        <input id="fast" type="checkbox">
        <span>
          <span class="check-title">Быстрая нарезка</span>
          <span class="hint">Видео без перекодирования: почти мгновенно, но начало клипа может сдвинуться на пару секунд. Звук обрабатывается всегда</span>
        </span>
      </label>

      <div class="field">
        <span class="field-label">Папка для клипов</span>
        <div class="folder">
          <span id="out-path" class="folder-path"></span>
          <button id="out-change" class="btn ghost" type="button">Изменить</button>
        </div>
      </div>
    </section>

    <button id="run" class="btn primary" type="button" disabled>Нарезать</button>

    <div id="progress" class="progress" hidden>
      <div class="progress-top">
        <span id="progress-label"></span>
        <span id="progress-pct" class="num"></span>
      </div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="results" class="results" hidden aria-label="Результат">
      <div class="results-head">
        <h2 id="results-title"></h2>
        <div class="results-actions">
          <button id="open-folder" class="btn ghost" type="button">Открыть папку</button>
          <button id="copy-times" class="btn ghost" type="button">Скопировать таймкоды</button>
        </div>
      </div>
      <ol id="results-list" class="results-list"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
