name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          # ffmpeg-static качает бинарник под архитектуру раннера,
          # поэтому каждая архитектура Mac собирается на своём раннере.
          - os: macos-latest
            script: dist:mac
          - os: macos-15-intel
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: clipper-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la files
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" files/* --title "Clipper $TAG" --generate-notes
          else
            # Свежая сборка из main всегда лежит в релизе "latest".
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest files/* \
              --target "$GITHUB_SHA" \
              --title "Clipper (последняя сборка)" \
              --notes "Автоматическая сборка из main, коммит ${GITHUB_SHA::7}."
          fi
